[package]
name = "emby-desktop"
version = "0.1.0"
description = "Emby desktop client"
authors = ["Emby Desktop contributors"]
edition = "2021"

[workspace]
members = [".", "crates/emby-api", "crates/emby-mpv"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
emby-api = { path = "crates/emby-api", features = ["tls"] }
emby-mpv = { path = "crates/emby-mpv", default-features = false, features = ["serde"] }
# Used by the settings module's JSON file and Tauri command argument types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
