[package]
name = "emby-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "Async Emby HTTP client, wire DTOs and session storage for Emby Desktop (no Tauri dependency)"

[features]
default = []
# Emby Desktop builds with this enabled so https:// servers work through the
# Windows schannel backend (`native-tls`). Unit tests keep the default feature
# set (plain http) so they run in a container without OpenSSL.
tls = ["reqwest/native-tls"]

[dependencies]
# `json` pulls serde; TLS is opt-in via `tls` above.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
# Only used by the loopback HTTP tests; tokio is already in the workspace lock
# through Tauri, so this adds no new crate to the application graph.
tokio = { version = "1", features = ["macros", "rt", "time"] }
