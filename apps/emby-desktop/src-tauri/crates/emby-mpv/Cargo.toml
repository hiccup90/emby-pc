[package]
name = "emby-mpv"
version = "0.1.0"
edition = "2021"
publish = false
description = "libmpv embedding kernel for Emby Desktop (dynamic FFI, no Tauri dependency)"

[features]
# The wire types always exist; serde is only needed at the Tauri boundary
# (`Channel<PlayerSnapshot>` and command args). The desktop app enables it.
#
# It is not a default feature because this offline verification container has
# no C linker at all: `serde`'s build script is compiled to an executable
# before `cargo check` can run, so any serde dependency fails here with
# `linker cc not found`. On a normal Windows toolchain the app always compiles
# the crate with `features = ["serde"]`.
default = []
serde = ["dep:serde"]
# Only for a developer machine / CI with a working linker:
#   cargo test -p emby-mpv --features serde-tests
serde-tests = ["serde", "dep:serde_json"]

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
