<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0a0e13"/>
      <stop offset="0.55" stop-color="#141c26"/>
      <stop offset="1" stop-color="#20303f"/>
    </linearGradient>
    <radialGradient id="vig2" cx="0.45" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#33506b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2b3a"/>
      <stop offset="1" stop-color="#0d141d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>
  <rect width="1280" height="720" fill="url(#vig2)"/>
  <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a1520"/>
    <stop offset="0.5" stop-color="#1a3247"/>
    <stop offset="1" stop-color="#2c4c66"/>
  </linearGradient>
  <rect width="1280" height="720" fill="url(#skyg)"/>
  <radialGradient id="sung" cx="0.62" cy="0.44" r="0.4">
    <stop offset="0" stop-color="#FFCE9B" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#FFCE9B" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#sung)"/>
  <path d="M0 486 L150 396 L318 466 L470 378 L640 470 L820 392 L980 466 L1140 406 L1280 476 L1280 720 L0 720 Z" fill="#142434" opacity="0.9"/>
  <path d="M0 556 L220 486 L420 560 L610 496 L820 566 L1010 500 L1200 570 L1280 536 L1280 720 L0 720 Z" fill="#0b141d"/>
  <rect y="640" width="1280" height="80" fill="#070c11"/>


  <!-- 字幕 -->
  <text x="640" y="430" text-anchor="middle" font-size="26" font-weight="600" fill="#000" stroke="#000" stroke-width="5">这是 ASS 特效字幕示例</text>
  <text x="640" y="430" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">这是 ASS 特效字幕示例</text>

  <!-- 底部渐变遮罩 -->
  <rect x="0" y="380" width="1280" height="340" fill="url(#fade)"/>

  <!-- 播放统计面板 -->
  <g>
    <rect x="32" y="32" width="474" height="132" rx="10" fill="#0F172A" opacity="0.8" stroke="#1E293B" stroke-width="1"/>
    <text x="52" y="58" font-size="12" fill="#64748B" letter-spacing="2">播放统计</text>
    <text x="52" y="84" font-size="13.5" fill="#E2E8F0">1920×1080 · HEVC 10bit · 23.976 fps</text>
    <text x="52" y="106" font-size="13.5" fill="#E2E8F0">码率 12.4 Mbps · 硬解 d3d11va · 渲染 gpu-next</text>
    <text x="52" y="128" font-size="13.5" fill="#E2E8F0">掉帧 0 · A-V +0.002s · 缓冲 18.2s</text>
  </g>

  <!-- 标注 -->
  <g>
    <rect x="986" y="24" width="262" height="30" rx="15" fill="#3B82F6" opacity="0.92"/>
    <text x="1117" y="44" text-anchor="middle" font-size="12.5" fill="#ffffff">方案 B · Qt 覆盖窗口（QWidget 绘制）</text>
  </g>

  <!-- 进度条悬停缩略图 -->
  <g>
    <rect x="677" y="470" width="160" height="90" rx="6" fill="url(#thumb)" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="757" y="518" text-anchor="middle" font-size="12" fill="#94A3B8">缩略图预览</text>
    <rect x="719" y="532" width="76" height="20" rx="10" fill="#000000" opacity="0.72"/>
    <text x="757" y="546" text-anchor="middle" font-size="11.5" fill="#ffffff" font-family="DejaVu Sans Mono, monospace">27:12</text>
  </g>

  <!-- 标题 / 元信息 -->
  <text x="56" y="520" font-size="30" font-weight="700" fill="#ffffff">片名 · 第二季</text>
  <text x="56" y="550" font-size="15" fill="#ffffff" fill-opacity="0.62">S02 E03 · 剧集标题 · 45 分钟</text>

  <!-- 进度条 -->
  <g>
    <rect x="56" y="588" width="1168" height="4" rx="2" fill="#ffffff" opacity="0.18"/>
    <rect x="56" y="588" width="911" height="4" rx="2" fill="#ffffff" opacity="0.22"/>
    <rect x="56" y="588" width="701" height="4" rx="2" fill="#3B82F6"/>
    <rect x="348" y="586" width="2" height="8" rx="1" fill="#ffffff" opacity="0.45"/>
    <rect x="640" y="586" width="2" height="8" rx="1" fill="#ffffff" opacity="0.45"/>
    <rect x="932" y="586" width="2" height="8" rx="1" fill="#ffffff" opacity="0.45"/>
    <circle cx="757" cy="590" r="6" fill="#ffffff" stroke="#3B82F6" stroke-width="3"/>
  </g>

  <!-- 控制栏 -->
  <g fill="#ffffff" opacity="0.92" transform="translate(56,628) scale(1.15)">
    <rect x="2" y="3" width="2.8" height="18" rx="1"/>
    <path d="M23 3 L23 21 L10 12 Z"/>
  </g>

  <circle cx="124" cy="640" r="24" fill="#ffffff"/>
  <path d="M117 629.5 L117 650.5 L137 640 Z" fill="#0B0F14"/>

  <g fill="#ffffff" opacity="0.92" transform="translate(168,628) scale(1.15)">
    <rect x="19.2" y="3" width="2.8" height="18" rx="1"/>
    <path d="M1 3 L1 21 L14 12 Z"/>
  </g>

  <text x="216" y="646" font-size="15" fill="#ffffff" fill-opacity="0.8" font-family="DejaVu Sans Mono, monospace">27:12 / 45:12</text>

  <!-- 右侧按钮 -->
  <g>
    <rect x="888" y="622" width="96" height="36" rx="8" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="902" y="632" width="21" height="15" rx="3" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.9"/>
    <text x="912.5" y="643.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff" opacity="0.92">CC</text>
    <text x="934" y="645" font-size="13" fill="#ffffff" fill-opacity="0.9">字幕</text>

    <rect x="992" y="622" width="88" height="36" rx="8" fill="#ffffff" fill-opacity="0.10"/>
    <path d="M1006 635.5 h4 L1015 631 v18 L1010 644 h-4 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M1018 636 a5.4 5.4 0 0 1 0 8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <text x="1034" y="645" font-size="13" fill="#ffffff" fill-opacity="0.9">音轨</text>

    <rect x="1092" y="622" width="82" height="36" rx="8" fill="#ffffff" fill-opacity="0.10"/>
    <g fill="#ffffff" opacity="0.9" transform="translate(1102,630)">
      <rect x="2" y="9" width="3" height="6" rx="1"/>
      <rect x="8" y="5" width="3" height="10" rx="1"/>
      <rect x="14" y="2" width="3" height="13" rx="1"/>
    </g>
    <text x="1128" y="645" font-size="13" fill="#ffffff" fill-opacity="0.9">统计</text>

    <rect x="1184" y="622" width="40" height="36" rx="8" fill="#ffffff" fill-opacity="0.10"/>
    <g fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" opacity="0.9" transform="translate(1192,629)">
      <path d="M1 7 V3 a2 2 0 0 1 2 -2 h4"/>
      <path d="M23 7 V3 a2 2 0 0 0 -2 -2 h-4"/>
      <path d="M1 15 v4 a2 2 0 0 0 2 2 h4"/>
      <path d="M23 15 v4 a2 2 0 0 1 -2 2 h-4"/>
    </g>
  </g>

  <!-- 字幕选择弹层（Qt 菜单） -->
  <g filter="url(#shadow)">
    <rect x="980" y="418" width="244" height="168" rx="10" fill="#0F172A" opacity="0.97" stroke="#1E293B" stroke-width="1"/>
    <text x="1002" y="446" font-size="12" fill="#64748B" letter-spacing="2">字幕</text>

    <rect x="992" y="458" width="220" height="34" rx="6" fill="#3B82F6" fill-opacity="0.18"/>
    <text x="1006" y="480" font-size="13.5" fill="#ffffff">中文（简体）</text>
    <path d="M1188 468 l4 4 8 -9" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1006" y="514" font-size="13.5" fill="#CBD5E1">English</text>
    <text x="1006" y="548" font-size="13.5" fill="#CBD5E1">关闭字幕</text>
  </g>
</svg>