name: emby-desktop-windows

on:
  push:
    branches: [rewrite/tauri-emby]
    paths:
      - "apps/emby-desktop/**"
      - ".github/workflows/emby-desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (Tauri 2)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/emby-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Rust (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend and Windows app
        run: pnpm tauri build --no-bundle
