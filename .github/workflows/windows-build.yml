name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  LIBMPV_URL: "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261104/mpv-dev-x86_64-20261104-git-46787be250.7z"
  LIBMPV_SHA256: "5ae0aaa85b2e690e9c574a44e10a86f3d5fe4b406ef6dfa684f5ab25e6bf6306"

jobs:
  windows:
    name: Windows x64 Release
    # 说明：2026-11 起 windows-latest 已指向 Windows Server 2025 + Visual Studio 2026，
    # 该镜像不再自带 VS 2022（CMake 的 "Visual Studio 17 2022" 生成器不存在）。
    # Qt 6.8 的 win64_msvc2022_64 二进制与 VS 2022 匹配，因此这里固定 windows-2022。
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Fetch libmpv (fixed URL + SHA-256)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./app/scripts/fetch-libmpv.ps1 -Url "$env:LIBMPV_URL" -Sha256 "$env:LIBMPV_SHA256" -SkipDocUpdate
          if ($LASTEXITCODE -ne 0) { throw "fetch-libmpv.ps1 failed (exit $LASTEXITCODE)" }

      - name: Configure CMake (Release, x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S app -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

      - name: Build (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed (exit $LASTEXITCODE)" }

      - name: Emby API tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S app/src/emby -B build-emby -G "Visual Studio 17 2022" -A x64 -DEMBY_BUILD_TESTS=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (emby tests) failed (exit $LASTEXITCODE)" }
          cmake --build build-emby --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "emby tests build failed (exit $LASTEXITCODE)" }
          ctest --test-dir build-emby -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "emby tests failed (exit $LASTEXITCODE)" }

      - name: Package (windeployqt + libmpv + zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./app/scripts/package-windows.ps1 -QtPrefix $env:QT_ROOT_DIR -BuildDir build -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw "package-windows.ps1 failed (exit $LASTEXITCODE)" }
          $zip = Get-ChildItem -Path dist -Filter "emby-pc-*-win64.zip" | Select-Object -First 1
          if ($null -eq $zip) { throw "dist 下没有生成发布 zip" }
          Copy-Item $zip.FullName "dist/emby-pc-win64.zip" -Force
          Write-Host ("Artifact source: " + $zip.FullName)

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010 -and $LASTEXITCODE -ne 1641) {
            throw "choco install innosetup failed (exit $LASTEXITCODE)"
          }
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found (checked: $($candidates -join ', '))" }
          Write-Host ("ISCC: " + $iscc)
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify exe VERSIONINFO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = Select-String -Path app/CMakeLists.txt -Pattern 'project\s*\(\s*emby-pc\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' -AllMatches
          if ($null -eq $match -or $match.Matches.Count -eq 0) { throw "无法从 app/CMakeLists.txt 解析版本号" }
          $version = $match.Matches[0].Groups[1].Value
          $exe = "dist/emby-pc-$version-win64/emby-pc.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host ("VERSIONINFO: ProductName=" + $vi.ProductName + " ProductVersion=" + $vi.ProductVersion + " FileVersion=" + $vi.FileVersion)
          if ($vi.ProductVersion -notlike "$version*") { throw "ProductVersion 不匹配: $($vi.ProductVersion)" }
          if ($vi.ProductName -ne "Emby PC") { throw "ProductName 不匹配: $($vi.ProductName)" }
          if ($vi.FileDescription -ne "Emby PC") { throw "FileDescription 不匹配: $($vi.FileDescription)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = Select-String -Path app/CMakeLists.txt -Pattern 'project\s*\(\s*emby-pc\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' -AllMatches
          if ($null -eq $match -or $match.Matches.Count -eq 0) { throw "无法从 app/CMakeLists.txt 解析版本号" }
          $version = $match.Matches[0].Groups[1].Value
          $stageDir = (Resolve-Path "dist/emby-pc-$version-win64").Path
          $iscc = $env:ISCC_PATH
          if (-not $iscc -or -not (Test-Path $iscc)) { throw "ISCC_PATH 未设置或不存在: $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$stageDir" "installer\emby-pc.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
          $setup = Get-ChildItem -Path dist -Filter "emby-pc-*-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "dist 下没有生成安装包" }
          $sizeMb = [math]::Round($setup.Length / 1MB, 2)
          Write-Host ("Installer: " + $setup.FullName + " (" + $sizeMb + " MB)")
          if ($setup.Length -gt 150MB) { throw "安装包超过 150MB 目标: $sizeMb MB" }

      - name: Upload artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: emby-pc-win64
          path: dist/emby-pc-win64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: emby-pc-installer
          path: dist/emby-pc-*-setup.exe
          if-no-files-found: error
          retention-days: 7
